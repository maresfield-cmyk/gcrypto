# Hand-maintained exchange facts. Every row carries last_verified (YYYY-MM-DD); the site shows it and alerts after 14 days.
# verified: false = filled in from general knowledge, not yet checked against the source: the site labels it "unverified".
# Licensing rows were checked on 2026-10-20 against the VARA public register where possible (per-entity pages under
# https://vara.ae/en/licenses-and-register/public-register/); the ADGM, CBB and CMA registers are JavaScript apps that cannot be read by a script,
# so those rows cite the regulator's or exchange's own announcement. Re-check all rows quarterly. The UAE SCA became the CMA on 2026-01-01 (https://www.uaecma.gov.ae/).
# Licensing wording must stay factual and dated; link the regulator's register where possible.
exchanges:
  binance:
    name: Binance
    website: https://www.binance.com
    fee_source: api            # api = fetched from the exchange's API; manual = data/manual/fees-manual.csv
    fee_page: https://www.binance.com/en/fee/cryptoFee
    gulf_licensing:
      - { region: "Dubai (VARA)", status: "VASP licence, active since 2024-04-15 (VL/24/04/001): exchange, broker-dealer, lending, management; retail allowed, derivatives for qualified investors only", entity: "Binance FZE", region_ar: "دبي (VARA)", status_ar: "رخصة VASP سارية منذ 2024-04-15 (VL/24/04/001): تداول، وساطة، إقراض، إدارة؛ مسموح للأفراد، والمشتقات للمستثمرين المؤهلين فقط", source: "https://vara.ae/en/licenses-and-register/public-register/binance-fze", last_verified: "2026-10-20", verified: true }
      - { region: "Abu Dhabi (ADGM)", status: "FSRA-authorised since 2025-12-08 as exchange, clearing house and broker-dealer (Nest entities); Binance.com operated under ADGM from 2026-01-05", entity: "Nest Exchange Ltd, Nest Clearing and Custody Ltd, Nest Trading Ltd", region_ar: "أبوظبي (ADGM)", status_ar: "مرخّصة من FSRA منذ 2025-12-08 كمنصة تداول وغرفة مقاصة ووسيط (كيانات Nest)؛ وتعمل Binance.com تحت ADGM منذ 2026-01-05", source: "https://www.adgm.com/media/announcements/binance-becomes-first-crypto-exchange-to-secure-a-global-license-under-adgm-framework-setting-a-new-standard-in-digital-asset-regulation", last_verified: "2026-10-20", verified: true }
      - { region: "Bahrain (CBB)", status: "Category 4 crypto-asset licence since May 2022", note: "CBB register is a JavaScript app, not machine-readable; checked against Binance's own statement", entity: "Binance Bahrain B.S.C.", region_ar: "البحرين (CBB)", status_ar: "رخصة أصول مشفرة من الفئة 4 منذ مايو 2022", source: "https://www.binance.com/en-BH", last_verified: "2026-10-20", verified: true }
      - { region: "Saudi Arabia", status: "no licence regime: SAMA and CMA have stated virtual currencies are unregulated and no party is licensed", entity: "", region_ar: "السعودية", status_ar: "لا يوجد نظام ترخيص: أعلن البنك المركزي السعودي (ساما) وهيئة السوق المالية أن العملات الافتراضية غير منظمة ولا جهة مرخصة للتعامل بها", source: "https://sama.gov.sa/en-US/MediaCenter/News/Pages/news12082018.aspx", last_verified: "2026-10-20", verified: true }
    deposit_currencies: [AED, BHD, SAR, KWD, QAR, OMR]
    deposits: [{ ccy: "AED", methods: [bank, p2p] }, { ccy: "BHD", methods: [card, p2p] }, { ccy: "SAR", methods: [p2p] }, { ccy: "KWD", methods: [p2p] }, { ccy: "QAR", methods: [p2p] }, { ccy: "OMR", methods: [p2p] }]
    p2p: true
    funding_source: "https://www.binance.com/en/support/faq/how-to-buy-crypto-with-bhd-atm-card-on-binance-a20fa1673b75454bb1b9a783566064cd"
    funding_note: "AED bank rail per the June 2026 launch announcement (eligible UAE users, Binance FZE); P2P ads live in all six currencies on 2026-10-20"
    last_verified: "2026-10-20"
