# Hand-maintained exchange facts. Every row carries last_verified (YYYY-MM-DD); the site shows it and alerts after 14 days.
# verified: false = filled in from general knowledge, not yet checked against the source: the site labels it "unverified".
# Licensing rows were checked on 2026-10-20 against the VARA public register where possible (per-entity pages under
# https://vara.ae/en/licenses-and-register/public-register/); the ADGM, CBB and CMA registers are JavaScript apps that cannot be read by a script,
# so those rows cite the regulator's or exchange's own announcement. Re-check all rows quarterly. The UAE SCA became the CMA on 2026-01-01 (https://www.uaecma.gov.ae/).
# Licensing wording must stay factual and dated; link the regulator's register where possible.
exchanges:
  binance:
    name: Binance
    website: https://www.binance.com
    fee_source: api            # api = fetched from the exchange's API; manual = data/manual/fees-manual.csv
    fee_page: https://www.binance.com/en/fee/cryptoFee
    gulf_licensing:
      - { region: "Dubai (VARA)", status: "VASP licence, active since 2024-04-15 (VL/24/04/001): exchange, broker-dealer, lending, management; retail allowed, derivatives for qualified investors only", entity: "Binance FZE", source: "https://vara.ae/en/licenses-and-register/public-register/binance-fze", last_verified: "2026-10-20", verified: true }
      - { region: "Abu Dhabi (ADGM)", status: "FSRA-authorised since 2025-12-08 as exchange, clearing house and broker-dealer (Nest entities); Binance.com operated under ADGM from 2026-01-05", entity: "Nest Exchange Ltd, Nest Clearing and Custody Ltd, Nest Trading Ltd", source: "https://www.adgm.com/media/announcements/binance-becomes-first-crypto-exchange-to-secure-a-global-license-under-adgm-framework-setting-a-new-standard-in-digital-asset-regulation", last_verified: "2026-10-20", verified: true }
      - { region: "Bahrain (CBB)", status: "Category 4 crypto-asset licence since May 2022 (CBB register not machine-readable; checked against Binance's own statement)", entity: "Binance Bahrain B.S.C.", source: "https://www.binance.com/en-BH", last_verified: "2026-10-20", verified: true }
      - { region: "Saudi Arabia", status: "no licence regime: SAMA and CMA have stated virtual currencies are unregulated and no party is licensed", entity: "", source: "https://sama.gov.sa/en-US/MediaCenter/News/Pages/news12082018.aspx", last_verified: "2026-10-20", verified: true }
    deposit_currencies: ["AED", "SAR", "BHD", "KWD", "QAR"]   # via P2P and/or card; verify which are bank deposits
    p2p: true
    last_verified: ""
  bybit:
    name: Bybit
    website: https://www.bybit.com
    fee_source: manual   # our API key is on the Bybit EU entity, whose list and fees differ from bybit.com; rows come from the global status page below
    fee_page: https://www.bybit.com/en/announcement-info/deposit-withdraw/
    gulf_licensing:
      - { region: "Dubai (VARA)", status: "in-principle approval only (IPA/24/08/001, 2024-08-21), not operational; no VARA licence", entity: "Bybit Fintech FZE", source: "https://vara.ae/en/licenses-and-register/public-register/bybit-fintech-fze-bybit", last_verified: "2026-10-20", verified: true }
      - { region: "UAE federal (SCA, now CMA)", status: "Virtual Asset Platform Operator licence, October 2025 (announced by Bybit; CMA register not machine-readable)", entity: "", source: "https://www.dlnews.com/external/bybit-secures-uaes-first-virtual-asset-platform-operator-license-from-securities-and-commodities-authority/", last_verified: "2026-10-20", verified: true }
    deposit_currencies: ["AED", "SAR", "KWD", "QAR", "BHD"]
    p2p: true
    last_verified: ""
  okx:
    name: OKX
    website: https://www.okx.com
    fee_source: api
    fee_page: https://www.okx.com/fees
    gulf_licensing:
      - { region: "Dubai (VARA)", status: "VASP licence, active since 2024-09-17 (VL/23/12/003): exchange, broker-dealer, lending, management; retail allowed", entity: "OKX Middle East Fintech FZE", source: "https://vara.ae/en/licenses-and-register/public-register/okx-middle-east-fintech-fze", last_verified: "2026-10-20", verified: true }
    deposit_currencies: ["AED"]
    p2p: true
    last_verified: ""
  kucoin:
    name: KuCoin
    website: https://www.kucoin.com
    fee_source: api
    fee_page: https://www.kucoin.com/fee/withdrawal
    gulf_licensing:
      - { region: "Dubai (VARA)", status: "not licensed: VARA cease-and-desist 2026-03-05 and notice of fines 2026-06-24 for unlicensed services", entity: "Peken Global Limited", source: "https://www.vara.ae/en/regulations/regulatory-notices/vara-notice-of-fines-peken-global-limited-kucoin/", last_verified: "2026-10-20", verified: true }
      - { region: "Gulf (other)", status: "no ADGM, CBB or CMA licence found", entity: "", source: "https://vara.ae/en/licenses-and-register/public-register/", last_verified: "2026-10-20", verified: true }
    deposit_currencies: []
    p2p: true
    last_verified: ""
  bitget:
    name: Bitget
    website: https://www.bitget.com
    fee_source: api
    fee_page: https://www.bitget.com/fee
    gulf_licensing:
      - { region: "Dubai (VARA)", status: "not on the VARA register; a DIFC innovation licence (commercial, not a virtual-asset authorisation) since August 2025; VARA application reported as under assessment", entity: "", source: "https://www.financemiddleeast.com/?p=23089", last_verified: "2026-10-20", verified: true }
    deposit_currencies: []
    p2p: true
    last_verified: ""
  rain:
    name: Rain
    website: https://www.rain.com
    fee_source: manual
    fee_page: https://www.rain.com        # no public fee page found (2026-10-19); fees are in the app / help centre
    gulf_licensing:
      - { region: "Bahrain (CBB)", status: "Category 3 crypto-asset services provider since 2019 (CBB register not machine-readable; checked against Rain's own page)", entity: "Rain Management W.L.L.", source: "https://www.rain.com/en-sa/about-us", last_verified: "2026-10-20", verified: true }
      - { region: "Abu Dhabi (ADGM)", status: "FSRA financial services permission for brokerage and custody (2023)", entity: "Rain Trading Limited", source: "https://www.rain.com/en-sa/about-us", last_verified: "2026-10-20", verified: true }
      - { region: "Dubai (VARA)", status: "VASP licence, active since 2026-10-05 (VL/26/10/001): exchange and broker-dealer; retail allowed", entity: "Rain MENA FZE", source: "https://vara.ae/en/licenses-and-register/public-register/rain-mena-fze", last_verified: "2026-10-20", verified: true }
    deposit_currencies: ["BHD", "AED", "SAR", "KWD", "OMR"]
    p2p: false
    last_verified: ""
  bitoasis:
    name: BitOasis
    website: https://bitoasis.net
    fee_source: manual
    fee_page: https://bitoasis.net/en/page/fees/crypto   # says 'Send crypto: network fee' only; figures come from the app's Send screen. Cloudflare blocks scripts: open in a browser    # blocks scripts (403); check in a browser
    gulf_licensing:
      - { region: "Dubai (VARA)", status: "VASP licence, active since 2024-11-29 (VL/2024/11/001): broker-dealer; retail allowed (2023 suspension lifted April 2024)", entity: "BitOasis Technologies FZE", source: "https://vara.ae/en/licenses-and-register/public-register/bitoasis-technologies-fze", last_verified: "2026-10-20", verified: true }
    deposit_currencies: ["AED", "SAR"]
    p2p: false
    last_verified: ""
  coinmena:
    name: CoinMENA
    website: https://www.coinmena.com
    fee_source: manual
    fee_page: https://www.coinmena.com/fees
    gulf_licensing:
      - { region: "Bahrain (CBB)", status: "Category 3 crypto-asset service provider (CBB register not machine-readable; checked against CoinMENA's own site)", entity: "CoinMENA B.S.C.", source: "https://www.coinmena.com/", last_verified: "2026-10-20", verified: true }
      - { region: "Dubai (VARA)", status: "VASP licence, active since 2023-11-30 (VL/23/09/001): broker-dealer; retail allowed. VARA notice of fines 2026-06-22 for AML programme failures; licence remains active", entity: "CoinMENA FZE", source: "https://vara.ae/en/licenses-and-register/public-register/coinmena-fze", last_verified: "2026-10-20", verified: true }
    deposit_currencies: ["BHD", "AED", "SAR", "KWD", "OMR", "USD"]
    p2p: false
    last_verified: ""
  cryptocom:
    name: Crypto.com
    website: https://crypto.com
    fee_source: manual        # switches to api if CRYPTOCOM_API_KEY is set
    fee_page: https://crypto.com/eea/fees-limits   # the App's fee page; the Exchange (crypto.com/exchange) is a separate product
    gulf_licensing:
      - { region: "Dubai (VARA)", status: "VASP licence, active since 2024-04-03 (VL/23/10/003): exchange, broker-dealer, lending, management; retail allowed", entity: "Foris DAX Middle East FZE", source: "https://www.vara.ae/en/licenses-and-register/public-register/foris-dax-middle-east-fze-cryptocom/", last_verified: "2026-10-20", verified: true }
    deposit_currencies: ["AED"]
    p2p: false
    last_verified: ""
